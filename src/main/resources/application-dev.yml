spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: Corsi
          uri: http://localhost:8081
          predicates:
            - Path=/api/corsi/**
          filters:
            - StripPrefix=1
            - RewritePath=/api/corsi/(?<segment>.*), /corsi/${segment}

        - id: Discenti
          uri: http://localhost:8080
          predicates:
            - Path=/api/discenti/**
          filters:
            - StripPrefix=1
            - RewritePath=/api/discenti/(?<segment>.*), /discenti/${segment}

        - id: Docenti
          uri: http://localhost:8080
          predicates:
            - Path=/api/docenti/**
          features:
            - StripPrefix=1
            - RewritePath=/api/docenti/(?<segment>.*),/docenti/${segment}

server:
  port: 9090

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
    root: INFO