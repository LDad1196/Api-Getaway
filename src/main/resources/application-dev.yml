
spring:
  application:
    name: api-gateway

  datasource:
    url: jdbc:postgresql://localhost:5432/user_auth
    username: postgres
    password: 1234567890
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  cloud:
    gateway:
      routes:
        - id: corsi-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/corsi/**
          filters:
            - StripPrefix=1
            - RewritePath=/api/corsi/(?<segment>.*), /corsi/${segment}

        - id: Discenti
          uri: http://localhost:8080
          predicates:
            - Path=/api/discenti/**
          filters:
            - StripPrefix=1
            - RewritePath=/api/discenti/(?<segment>.*), /discenti/${segment}

        - id: Docenti
          uri: http://localhost:8080
          predicates:
            - Path=/api/docenti/**
          filters:
            - StripPrefix=1
            - RewritePath=/api/docenti/(?<segment>.*), /docenti/${segment}

server:
  port: 9090

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
    org.springframework.security: DEBUG
    com.example.demo: DEBUG
    root: INFO